[project]
name = "chatgpt-adapter"
version = "0.1.0"
description = "从 ChatGPT macOS DMG 构建 Linux 桌面适配版本"
requires-python = ">=3.12"

[project.scripts]
chatgpt-adapter = "chatgpt_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_adapter"]
