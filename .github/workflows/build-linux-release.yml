name: Build Arch Linux package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: "26.715.72359"
  PKG_NAME: "codex-app-linux"
  DEFAULT_CHATGPT_DMG_URL: "https://persistent.oaistatic.com/codex-app-prod/ChatGPT.dmg"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x86_64 runner
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git curl wget ca-certificates file 7zip zstd patchelf \
            python python-pip uv nodejs npm pnpm \
            libusb hidapi systemd-libs \
            gtk3 nss alsa-lib libxss libnotify libsecret xdg-utils \
            mesa libxkbcommon libxcomposite libxdamage libxrandr \
            xorg-server-xvfb namcap desktop-file-utils

      - name: Create unprivileged build user
        shell: bash
        run: |
          set -euxo pipefail
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Download and verify DMG input
        shell: bash
        env:
          SECRET_CHATGPT_DMG_URL: ${{ secrets.CHATGPT_DMG_URL }}
        run: |
          set -euo pipefail
          dmg_url="${SECRET_CHATGPT_DMG_URL:-${DEFAULT_CHATGPT_DMG_URL}}"
          install -d -o builder -g builder /tmp/codex-app-input
          curl --fail --location --retry 3 \
            --output /tmp/codex-app-input/ChatGPT.dmg \
            "${dmg_url}"
          chown builder:builder /tmp/codex-app-input/ChatGPT.dmg

      - name: Prepare inputs and dependencies
        shell: bash
        run: |
          set -euxo pipefail
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash -lc '
              cd "$GITHUB_WORKSPACE"
              source scripts/项目环境.sh
              uv run --no-project scripts/准备_DMG输入.py \
                --source /tmp/codex-app-input/ChatGPT.dmg
              uv run --no-project scripts/下载_Electron_runtime.py
              uv run --no-project scripts/下载_Tectonic.py
              uv run --no-project scripts/构建_native模块.py --package-manager npm
            '

      - name: Run unit and static tests
        shell: bash
        run: |
          set -euxo pipefail
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash -lc '
              cd "$GITHUB_WORKSPACE"
              uv run python -m unittest discover -s tests -v
              python -m py_compile scripts/冒烟_GUI.py
              bash -n packaging/arch/codex-app-launcher
              desktop-file-validate packaging/arch/codex-app.desktop
            '

      - name: Build and audit Linux prototype
        shell: bash
        run: |
          set -euxo pipefail
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            APP_VERSION="${APP_VERSION}" \
            bash -lc '
              cd "$GITHUB_WORKSPACE"
              uv run scripts/构建_Linux版本.py --no-package
              prototype="build/ChatGPT-linux-${APP_VERSION}"
              test -x "$prototype/run-chatgpt-linux.sh"
              test -x "$prototype/ChatGPT"
              grep -q "CODEX_APP_SERVER_PORT:-18767" "$prototype/run-chatgpt-linux.sh"
              python -c "import json; p=json.load(open(\"$prototype/.codex-linux/patch-report.json\")); assert p[\"summary\"][\"requiredFailures\"] == 0"
              python -c "import json; p=json.load(open(\"$prototype/.codex-linux/platform-audit.json\")); assert not p[\"macho\"]; assert not p[\"unresolvedLibraries\"]"
            '

      - name: Run GUI and app-server smoke test
        shell: bash
        run: |
          set -euxo pipefail
          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash -lc '
              cd "$GITHUB_WORKSPACE"
              uv run --no-project scripts/冒烟_GUI.py \
                --seconds 15 \
                --xvfb \
                --mock-app-server \
                --port 18767
            '

      - name: Build pacman package
        shell: bash
        run: |
          set -euxo pipefail
          runuser -u builder -- env \
            HOME=/home/builder \
            PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            bash -lc '
              cd "$PROJECT_ROOT/packaging/arch"
              makepkg --cleanbuild --force --noconfirm
            '

          install -d dist
          find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' \
            -exec cp -v {} dist/ \;
          test "$(find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)" -eq 1
          sha256sum dist/*.pkg.tar.zst > dist/SHA256SUMS

      - name: Validate, install and remove package
        shell: bash
        run: |
          set -euxo pipefail
          package="$(find dist -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          case "${package}" in
            *-x86_64.pkg.tar.zst) ;;
            *) echo "Unexpected package architecture: ${package}" >&2; exit 1 ;;
          esac
          pacman -Qip "${package}"
          pacman -Qlp "${package}"
          namcap packaging/arch/PKGBUILD || true
          namcap "${package}" || true
          pacman -U --noconfirm "${package}"
          test -x /usr/bin/codex-app
          test -x /opt/codex-app/ChatGPT
          test -f /usr/share/applications/codex-app.desktop
          test -f /usr/share/doc/codex-app-linux/build-reports/patch-report.json
          test -f /usr/share/doc/codex-app-linux/build-reports/platform-audit.json
          grep -q 'CODEX_APP_SERVER_PORT:-18767' /usr/bin/codex-app
          pacman -Rns --noconfirm codex-app-linux
          test ! -e /usr/bin/codex-app
          test ! -e /opt/codex-app

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-app-linux-${{ env.APP_VERSION }}-x86_64
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
            packaging/arch/PKGBUILD
            build/ChatGPT-linux-${{ env.APP_VERSION }}/.codex-linux/*.json
            tmp/gui-smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compatibility-failure-${{ github.run_id }}
          path: |
            build/ChatGPT-linux-${{ env.APP_VERSION }}/.codex-linux/*.json
            tmp/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
            packaging/arch/PKGBUILD
            build/ChatGPT-linux-${{ env.APP_VERSION }}/.codex-linux/*.json
