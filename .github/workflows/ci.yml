name: Source validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git python uv desktop-file-utils shellcheck

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          uv run python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          bash -n packaging/arch/codex-app-launcher
          shellcheck packaging/arch/codex-app-launcher
          desktop-file-validate packaging/arch/codex-app.desktop
          grep -q "arch=('x86_64')" packaging/arch/PKGBUILD
          grep -q 'CODEX_APP_SERVER_PORT:-18767' packaging/arch/codex-app-launcher
