name: Source validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true

      - name: Install static tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck desktop-file-utils

      - name: Validate source
        shell: bash
        run: |
          set -euxo pipefail
          uv run python -m unittest discover -s tests -v
          python -m compileall -q src scripts tests
          bash -n packaging/arch/codex-app-launcher
          shellcheck packaging/arch/codex-app-launcher
          desktop-file-validate packaging/arch/codex-app.desktop
          grep -Fq "arch=('x86_64')" packaging/arch/PKGBUILD
          grep -Fq 'CODEX_APP_SERVER_PORT:-18767' packaging/arch/codex-app-launcher
